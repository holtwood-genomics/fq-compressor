name: Release

# 打 v* tag 时校验 tag、VERSION 与 CHANGELOG，再构建 release 二进制。
# 全部门禁通过后只创建或更新 draft Release；维护者核对 CHANGELOG、产物与
# smoke test 后手动发布。已正式发布的 Release 不允许被重跑 workflow 覆盖。

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag, VERSION and CHANGELOG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be vMAJOR.MINOR.PATCH: ${tag}" >&2
            exit 1
          fi
          if [[ "$version" != "$file_version" ]]; then
            echo "::error::tag ${tag} does not match VERSION ${file_version}" >&2
            exit 1
          fi
          if ! grep -Eq "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          section="$(awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [[ -z "${section//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md section for ${version} is empty" >&2
            exit 1
          fi

          release_error="$(mktemp)"
          trap 'rm -f "$release_error"' EXIT
          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          if is_draft="$(gh api "$endpoint" --jq '.draft' 2>"$release_error")"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release ${tag} is already published; refusing to mutate it" >&2
              exit 1
            fi
            echo "release metadata ok: ${tag} (existing draft will be updated)"
          elif grep -Fq 'HTTP 404' "$release_error"; then
            echo "release metadata ok: ${tag} (draft will be created)"
          else
            cat "$release_error" >&2
            echo "::error::failed to query existing release ${tag}" >&2
            exit 1
          fi

  release:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 只有发布 job 需要写 Release；构建与 smoke test 继承只读权限。
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # 构建目录由 preset 推导（CMakePresets.json 的 binaryDir 为
      # build/${presetName}）。产物路径统一引用此变量，避免 preset 与取件
      # 路径再次漂移。
      PRESET: clang-release-portable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607  # v1.2.25
        with:
          key: release-${{ runner.os }}

      - name: Build release binary
        uses: ./.github/actions/conan-build
        with:
          # FQC_PORTABLE=ON：发布产物禁用 -march=native，保证在旧 CPU 上可用
          # （clang-release-portable 预设；每 PR 的 release-build job 已在同一
          # 配置下跑过编译+测试门禁）
          preset: ${{ env.PRESET }}
          conan-build-type: Release

      # 发布回归 sanity：不做性能断言（CI 吞吐波动 ±20-85%，见
      # docs/roadmap.md 阶段 E），只验证 round-trip 与 verify 功能可用。
      - name: Round-trip and verify sanity
        run: |
          set -euo pipefail
          fqc=build/${{ env.PRESET }}/src/fqc
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          "$fqc" compress -i tests/fixtures/sequential-v2/input_se.fastq -o "$tmp/se.fqc"
          "$fqc" verify "$tmp/se.fqc"
          "$fqc" decompress -i "$tmp/se.fqc" -o "$tmp/se.out.fastq"
          cmp tests/fixtures/sequential-v2/input_se.fastq "$tmp/se.out.fastq"
          "$fqc" --version
          echo "::notice::release smoke test passed"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/${{ env.PRESET }}/src/fqc dist/fqc
          # 发布资产附带本项目许可证与静态链接依赖的许可证声明
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/
          ldd dist/fqc
          # 校验和条目必须与上传后的扁平资产名一致，否则下载后无法直接校验。
          (cd dist && sha256sum fqc > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-path: dist/*

      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_error="$(mktemp)"
          trap 'rm -f "$release_error"' EXIT
          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          if is_draft="$(gh api "$endpoint" --jq '.draft' 2>"$release_error")"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release ${GITHUB_REF_NAME} is already published; refusing to mutate it" >&2
              exit 1
            fi
          elif grep -Fq 'HTTP 404' "$release_error"; then
            echo "no existing release; a draft will be created"
          else
            cat "$release_error" >&2
            echo "::error::failed to query existing release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Upload draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # 先创建/更新 draft；维护者核对 CHANGELOG、产物与 smoke test 后手动发布。
          draft: true
