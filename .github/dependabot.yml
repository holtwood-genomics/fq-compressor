# Dependabot 自动更新 GitHub Actions
# Action 固定到 commit SHA 后，由 Dependabot 在版本更新时同步更新 SHA 与行尾版本注释。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
